{{ define "main" }}
  <!-- Redirect the site root to /home/ (Home = tag explorer) -->
  <meta http-equiv="refresh" content="0; url={{ "home/" | relURL }}" />
  <script>location.replace("{{ "home/" | relURL }}");</script>

  <section class="card">
    <p class="muted">Redirecting to Home…</p>
    <p><a class="btn" href="{{ "home/" | relURL }}">Go to Home</a></p>
  </section>
{{ end }}
