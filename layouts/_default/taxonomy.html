{{ define "main" }}
  <section class="card">
    <div class="meta">
      <a class="muted" href="{{ "/tags/" | relURL }}">← All tags</a>
    </div>

    <h2 class="title">Tag: #{{ .Title }}</h2>

    <ul class="post-list">
      {{ range .Pages.ByDate.Reverse }}
        <li class="post-item">
          <div class="post-main">
            <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
            <div class="muted small">{{ .Date.Format "2006-01-02" }}</div>
          </div>
          {{ with .Params.tags }}
            <div class="tags">
              {{ range . }}
                <a class="tag" href="{{ (printf "/tags/%s/" (. | urlize)) | relURL }}">#{{ . }}</a>
              {{ end }}
            </div>
          {{ end }}
        </li>
      {{ end }}
    </ul>
  </section>
{{ end }}
