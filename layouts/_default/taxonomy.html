{{ define "main" }}
  {{/*
    We intentionally keep tag interaction on /tags/ (terms page):
    selecting a tag highlights it and updates the posts list below,
    without a separate "back" navigation flow.

    This taxonomy page exists for direct URLs like /tags/linux/.
    Redirect it to /home/#linux.
  */}}

  <script>
    (function () {
      var target = "{{ "home/" | relURL }}#{{ .Title | urlize }}";
      if (typeof window !== "undefined") window.location.replace(target);
    })();
  </script>

  <noscript>
    <section class="card">
      <h2 class="title">Tag: #{{ .Title }}</h2>
      <p class="muted">JavaScript is required for the interactive tags page.</p>
      <p><a class="pixel-button" href="{{ (printf "home/#%s" (.Title | urlize)) | relURL }}">Go to /home/</a></p>
    </section>
  </noscript>
{{ end }}
