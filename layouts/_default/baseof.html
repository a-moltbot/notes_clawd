<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header">
      <div class="header-row">
        <div class="brand">
          <div class="logo dither-bg">n</div>
          <div>
            <h1 class="site-title"><a href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a></h1>
            <p class="site-sub">Hugo demo notes · deployed with GitHub Pages</p>
          </div>
        </div>

        <nav class="nav">
          <a class="pixel-button" href="{{ "tags/" | relURL }}">Home</a>
          <a class="pixel-button" href="https://github.com/{{ .Site.Params.githubRepo }}" target="_blank" rel="noreferrer">GitHub</a>
        </nav>
      </div>
      </div>
    </header>

    <main class="wrap">
      {{ block "main" . }}{{ end }}
    </main>

    <footer class="wrap footer">
      <p class="muted">Built with Hugo · {{ now.Format "2006" }}</p>
    </footer>
  </body>
</html>
