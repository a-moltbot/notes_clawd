name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Triggered by notes_content repo
  repository_dispatch:
    types: [notes-content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Where your Markdown content lives (owner/name)
  # Configure these in GitHub: Settings → Secrets and variables → Actions → Variables
  NOTES_CONTENT_REPO: ${{ vars.NOTES_CONTENT_REPO }}
  NOTES_CONTENT_REF: ${{ vars.NOTES_CONTENT_REF }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      # If notes_content is public, default GITHUB_TOKEN is fine.
      # If notes_content is private, set repo secret NOTES_CONTENT_CHECKOUT_TOKEN.
      - name: Checkout notes_content repo (public)
        if: ${{ secrets.NOTES_CONTENT_CHECKOUT_TOKEN == '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NOTES_CONTENT_REPO }}
          ref: ${{ env.NOTES_CONTENT_REF }}
          path: __notes_content

      - name: Checkout notes_content repo (private)
        if: ${{ secrets.NOTES_CONTENT_CHECKOUT_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NOTES_CONTENT_REPO }}
          ref: ${{ env.NOTES_CONTENT_REF }}
          path: __notes_content
          token: ${{ secrets.NOTES_CONTENT_CHECKOUT_TOKEN }}

      - name: Sync content into Hugo site
        run: |
          if [ ! -d "__notes_content/content" ]; then
            echo "::error::notes_content repo is missing a content/ directory"
            exit 1
          fi
          mkdir -p content
          rsync -a --delete __notes_content/content/ content/

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
