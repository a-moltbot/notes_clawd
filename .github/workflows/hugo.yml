name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Triggered by notes_content repo
  repository_dispatch:
    types: [notes-content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Cancel older builds when a newer commit arrives (faster feedback, less wasted CI time)
  cancel-in-progress: true

# Content repo to pull Markdown from
env:
  NOTES_CONTENT_REPO: a-moltbot/notes_content
  NOTES_CONTENT_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout notes_content repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NOTES_CONTENT_REPO }}
          ref: ${{ env.NOTES_CONTENT_REF }}
          path: __notes_content
          fetch-depth: 1
          # Only pull the content/ tree to speed up clones as the repo grows
          sparse-checkout: |
            content
          sparse-checkout-cone-mode: true

      - name: Sync content into Hugo site
        run: |
          if [ ! -d "__notes_content/content" ]; then
            echo "::error::notes_content repo is missing a content/ directory"
            exit 1
          fi
          mkdir -p content
          rsync -a --delete __notes_content/content/ content/

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4